<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found — Giulietta Cappelletti</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="/images/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Solway:wght@400&family=Karla:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#F4F1EA;--fg:#171512;--fg-soft:#6E675C;--a1:#2C63B8;--dots:rgba(23,21,18,.11)}
@media (prefers-color-scheme:dark){:root{--bg:#14120F;--fg:#F1EDE4;--fg-soft:#9C9488;--a1:#74A7F4;--dots:rgba(241,237,228,.13)}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:40px 24px;background:var(--bg) radial-gradient(var(--dots) 1px,transparent 1px) 0 0/24px 24px;color:var(--fg);font-family:'Karla',system-ui,sans-serif;text-align:center}
p.k{font-size:13px;letter-spacing:.09em;text-transform:uppercase;color:var(--a1);margin:0 0 14px}
h1{font-family:'Solway',Georgia,serif;font-weight:400;font-size:clamp(30px,5vw,48px);line-height:1.15;margin:0 0 16px;text-wrap:balance}
p{font-size:18px;line-height:1.6;color:var(--fg-soft);max-width:520px;margin:0 auto 30px}
a{display:inline-block;padding:14px 28px;border-radius:999px;background:var(--fg);color:var(--bg);text-decoration:none;font-size:17px;font-weight:500}
a:hover{background:var(--a1);color:var(--bg)}
</style>
</head>
<body>
<main>
<p class="k">404</p>
<h1>This page wandered off.</h1>
<p>The link might be old, or the page moved somewhere else. The work is still all here.</p>
<a href="/">Back to the portfolio</a>
</main>
</body>
</html>
