<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Solway:wght@400;500;700&amp;family=Karla:ital,wght@0,300;0,400;0,500;1,400&amp;family=Shantell+Sans:ital,wght@0,400;0,600&amp;display=swap" rel="stylesheet">
</helmet>
<nav style="position:fixed;top:0;left:0;right:0;z-index:60;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:16px;padding:14px 26px;backdrop-filter:blur(12px);background:color-mix(in srgb,var(--bg) 84%,transparent);border-bottom:1px solid var(--line)">
  <a href="./Portfolio.dc.html" style="justify-self:start;font-family:'Shantell Sans',cursive;font-weight:600;font-size:24px;text-decoration:none;letter-spacing:-.01em">giulietta</a>

  <div style="justify-self:center;display:flex;align-items:center;gap:4px;padding:4px;border:1px solid var(--line);border-radius:999px;background:var(--surface)">
    <sc-for list="{{ links }}" as="l" hint-placeholder-count="4">
      <a href="{{ l.href }}" style="padding:8px 16px;border-radius:999px;font-size:15px;text-decoration:none;background:{{ l.bg }};color:{{ l.color }};white-space:nowrap;transition:background .2s ease" style-hover="background:var(--tint)">{{ l.label }}</a>
    </sc-for>
  </div>

  <button onClick="{{ toggleTheme }}" aria-label="Toggle theme" style="justify-self:end;display:flex;align-items:center;gap:8px;padding:7px 14px 7px 8px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer;font-family:'Karla',sans-serif;font-size:14px" style-hover="border-color:var(--fg)">
    <span style="width:18px;height:18px;border-radius:50%;background:var(--a1);display:block"></span>{{ themeLabel }}
  </button>
</nav>
<div style="height:67px"></div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;home&quot;,&quot;projects&quot;,&quot;playground&quot;,&quot;about&quot;],&quot;default&quot;:&quot;home&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;cursorTrail&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  state = { theme: "light" };

  componentDidMount() {
    let saved = null;
    try { saved = localStorage.getItem("mira-theme"); } catch (e) {}
    const theme = saved || this.props.defaultTheme || "light";
    document.documentElement.setAttribute("data-theme", theme);
    this.setState({ theme });
    // la lampada nell'hero cambia il tema: teniamo allineata l'etichetta
    this._onTheme = (e) => this.setState({ theme: e.detail });
    window.addEventListener("mira-theme", this._onTheme);

    // scia del cursore: piccoli punti pieni, viene montata una volta per pagina dalla nav
    if (this.props.cursorTrail === false || window.__miraTrail) return;
    window.__miraTrail = true;

    // anello che insegue il puntatore con un ritardo elastico
    if (window.matchMedia("(pointer: fine)").matches) {
      const ring = document.createElement("div");
      ring.style.cssText = "position:fixed;left:0;top:0;width:34px;height:34px;margin:-17px 0 0 -17px;" +
        "border:1.5px solid var(--a1);border-radius:50%;pointer-events:none;z-index:9998;opacity:0;" +
        "transition:opacity .3s ease,width .22s ease,height .22s ease,margin .22s ease,background .22s ease;will-change:transform";
      document.body.appendChild(ring);
      this._ring = ring;

      let tx = innerWidth / 2, ty = innerHeight / 2, rx = tx, ry = ty;
      this._onRingMove = (e) => {
        tx = e.clientX; ty = e.clientY;
        ring.style.opacity = 1;
        // ingrandisce su tutto ciò che è cliccabile, anche dentro la scena
        const hit = e.composedPath().some((n) =>
          n.tagName && (n.tagName === "A" || n.tagName === "BUTTON" ||
            (n.style && n.style.cursor === "pointer")));
        const big = hit ? 56 : 34;
        ring.style.width = ring.style.height = big + "px";
        ring.style.margin = -big / 2 + "px 0 0 " + -big / 2 + "px";
        ring.style.background = hit ? "color-mix(in srgb, var(--a1) 14%, transparent)" : "transparent";
      };
      this._onRingOut = () => { ring.style.opacity = 0; };
      const tick = () => {
        rx += (tx - rx) * 0.16;
        ry += (ty - ry) * 0.16;
        ring.style.transform = `translate(${rx}px, ${ry}px)`;
        this._raf = requestAnimationFrame(tick);
      };
      tick();
      window.addEventListener("pointermove", this._onRingMove);
      document.addEventListener("pointerleave", this._onRingOut);
    }
    this._onMove = (e) => {
      const now = Date.now();
      if (this._last && now - this._last < 55) return;
      this._last = now;
      const d = document.createElement("i");
      const s = 5 + Math.random() * 7;
      d.style.cssText = `position:fixed;left:${e.clientX}px;top:${e.clientY}px;width:${s}px;height:${s}px;border-radius:50%;background:var(--a1);pointer-events:none;z-index:9999;transform:translate(-50%,-50%);animation:trailPop .8s ease forwards`;
      document.body.appendChild(d);
      setTimeout(() => d.remove(), 800);
    };
    window.addEventListener("pointermove", this._onMove);
  }

  componentWillUnmount() {
    if (this._onTheme) window.removeEventListener("mira-theme", this._onTheme);
    if (this._onMove) { window.removeEventListener("pointermove", this._onMove); window.__miraTrail = false; }
    if (this._onRingMove) window.removeEventListener("pointermove", this._onRingMove);
    if (this._onRingOut) document.removeEventListener("pointerleave", this._onRingOut);
    if (this._raf) cancelAnimationFrame(this._raf);
    if (this._ring) this._ring.remove();
  }

  renderVals() {
    const active = this.props.active || "home";
    const items = [
      { key: "home", label: "Home", href: "./Portfolio.dc.html" },
      { key: "projects", label: "Projects", href: "./Projects.dc.html" },
      { key: "playground", label: "Playground", href: "./Playground.dc.html" },
      { key: "about", label: "About", href: "./About.dc.html" }
    ];
    return {
      links: items.map((i) => ({
        ...i,
        bg: i.key === active ? "var(--fg)" : "transparent",
        color: i.key === active ? "var(--bg)" : "var(--fg)"
      })),
      themeLabel: this.state.theme === "dark" ? "Dark" : "Light",
      toggleTheme: () => {
        const next = this.state.theme === "dark" ? "light" : "dark";
        document.documentElement.setAttribute("data-theme", next);
        try { localStorage.setItem("mira-theme", next); } catch (e) {}
        window.dispatchEvent(new CustomEvent("mira-theme", { detail: next }));
        this.setState({ theme: next });
      }
    };
  }
}
</script>
</body>
</html>
